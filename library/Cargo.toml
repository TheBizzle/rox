[package]
name = "rox-lib"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

authors = ["TheBizzle <jason.bertsche@gmail.com>"]
description = "A Rust implementation of the clox bytecode virtual machine from Crafting Interpreters"
license = "BSD-3"
repository = "https://github.com/TheBizzle/rox"
readme = "README.md"

keywords = ["lox", "bytecode", "compiler", "virtual-machine"]
categories = ["development-tools"]

publish = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
strum = { version = "0.28", features = ["derive"] }
tokio = { version = "1.52.3", features = [] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2.128"
web-time = "1"

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
